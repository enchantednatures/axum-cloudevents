[workspace]
members = ["axum-cloudevents", "axum-cloudevents-macros"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/enchantednatures/axum-cloudevents"

[workspace.dependencies]
# Published to the private Kellnr registry. The local `.cargo/config.toml`
# patches this to the workspace member so `cargo test` works without a token.
axum-cloudevents-macros = { version = "0.1", registry = "kellnr" }
