[package]
name = "axum-cloudevents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CloudEvents extractors for Axum"
readme = "README.md"
keywords = ["axum", "cloudevents", "web", "http", "knative"]
categories = ["web-programming", "encoding"]
publish = ["kellnr"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
bytes = "1.0"
http = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

axum-cloudevents-macros = { workspace = true, optional = true }

[features]
default = ["macros"]
macros = ["dep:axum-cloudevents-macros"]

[dev-dependencies]
axum-test = "21"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
