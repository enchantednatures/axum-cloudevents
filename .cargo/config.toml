# Private Kellnr registry for the published axum-cloudevents crates.
#
# No token is stored in this file. Authenticate once with:
#   cargo login --registry kellnr
# or set CARGO_REGISTRIES_KELLNR_TOKEN in the environment.
[registries.kellnr]
index = "sparse+https://crates.enchantednatures.com/api/v1/crates/"
credential-provider = ["cargo:token"]

# Use the workspace's macros crate while developing. `cargo publish` ignores
# patches, so the published manifest still points at the Kellnr registry.
[patch.kellnr]
axum-cloudevents-macros = { path = "axum-cloudevents-macros" }
